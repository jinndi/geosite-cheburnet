name: Build Geosite

on:
  workflow_dispatch:
  schedule:
    # Запуск в 06:37 UTC (09:37 МСК) раз в 3 дня
    - cron: '37 6 */3 * *'

env:
  SINGBOX_VERSION: 1.12.25
  
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Process domain files
      run: |
        python << 'EOF'
        import os
        import json
        import urllib.request
        import urllib.error

        domains = set()
        stats = {"total_lines": 0}
        
        # --- УДАЛЕННЫЙ РЕПОЗИТОРИЙ v2fly ---
        REMOTE_BASE_URL = "https://raw.githubusercontent.com/v2fly/domain-list-community/refs/heads/master/data/"

        def download_and_process(url):
            try:
                req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                with urllib.request.urlopen(req, timeout=15) as response:
                    return response.read().decode('utf-8')
            except urllib.error.HTTPError as e:
                if e.code == 404:
                    print(f"Файл не найден (404): {url}")
                else:
                    print(f"Ошибка HTTP {e.code} при запросе: {url}")
            except Exception as e:
                print(f"Ошибка сети при запросе {url}: {e}")
            return None

        def process_line(line):
            line = line.strip()

            # 1. Заменяем возможные неразрывные пробелы (\xa0) на обычные
            line = line.replace('\xa0', ' ').strip()
            
            # 2. Отрезаем любые комментарии в конце строки (все, что после #)
            if '#' in line:
                line = line.split('#')[0].strip()

            # 3. Пропускаем пустые строки и комментарии
            if not line or line.startswith('#'):
                return

            # 4. Пропускаем рекламу И трекеры (@ads)
            if '@ads' in line:
                return

            # 5. Если строка - это прямая ссылка на другой веб-файл (полный URL)
            if line.startswith('http://') or line.startswith('https://'):
                print(f"Обнаружена прямая ссылка, скачиваю: {line}")
                content = download_and_process(line)
                if content:
                    for sub_line in content.splitlines():
                        process_line(sub_line)
                return

            # 6. Обработка "include:filename" из удаленного репозитория
            if line.startswith('include:'):
                include_name = line.split('include:')[1].strip()
                include_url = f"{REMOTE_BASE_URL}{include_name}"
                
                print(f"Запрос удаленного include файла: {include_url}")
                content = download_and_process(include_url)
                if content:
                    print(f"Успешно подключен удаленный файл: {include_name}")
                    for sub_line in content.splitlines():
                        process_line(sub_line)
                return

            # 7. Очистка префиксов "full:" и "domain:"
            if line.startswith('full:'):
                line = line.split('full:')[1]
            elif line.startswith('domain:'):
                line = line.split('domain:')[1]

            # 8. Очищаем от возможных пробелов и комментариев в конце строки (если они остались)
            if ' ' in line:
                line = line.split()[0]

            # 9. Финальная очистка и валидация домена
            stats["total_lines"] += 1
            domain = line.lower().strip()
            
            if domain.endswith('.'):
                domain = domain[:-1]
            if domain.startswith('www.'):
                domain = domain[4:]
                
            if domain and "." in domain:
                domains.add(domain)

        # Старт обработки локальных файлов из папки
        folder = 'geosite-cheburnet'
        if os.path.exists(folder):
            for filename in os.listdir(folder):
                if filename.endswith('.txt'):
                    print(f"Читаю стартовый файл: {filename}")
                    with open(os.path.join(folder, filename), 'r', encoding='utf-8') as f:
                        for line in f:
                            process_line(line)
        else:
            print(f"Предупреждение: Стартовая папка {folder} не найдена!")

        # Сортировка и удаление поддоменов
        domain_list = sorted(list(domains))
        all_domains_set = set(domain_list)
        unique_domains = []
        for d in domain_list:
            is_subdomain = False
            for u in all_domains_set:
                if d != u and d.endswith('.' + u):
                    is_subdomain = True
                    break
            if not is_subdomain:
                unique_domains.append(d)
        
        # Создаем JSON
        result = {
          "version": 3,
          "rules": [{
            "domain_suffix": unique_domains
          }]
        }
        
        with open('geosite-cheburnet.json', 'w', encoding='utf-8') as f:
          json.dump(result, f, ensure_ascii=False, indent=2)
        
        print(f"Итог {len(unique_domains)} уникальных доменов (из {stats['total_lines']} валидных исходных строк)")
        EOF

    - name: Install sing-box
      run: |
        wget https://github.com/SagerNet/sing-box/releases/download/v${{ env.SINGBOX_VERSION }}/sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64.tar.gz
        tar -xzf sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64.tar.gz
        sudo mv sing-box*/sing-box /usr/local/bin/
        chmod +x /usr/local/bin/sing-box

    - name: Convert to srs format
      run: |
        sing-box rule-set compile geosite-cheburnet.json -o geosite-cheburnet.srs

    - name: Count domains
      id: count_domains
      run: |
        COUNT=$(python -c "
        import json
        with open('geosite-cheburnet.json', 'r', encoding='utf-8') as f:
          data = json.load(f)
        print(len(data['rules'][0]['domain_suffix']))
        ")
        echo "count=$COUNT" >> $GITHUB_OUTPUT

    - name: Commit files to repository
      id: check_changes
      env:
        TZ: "Europe/Moscow"
      run: |
        if [ -z "$(git status --porcelain geosite-cheburnet.json geosite-cheburnet.srs)" ]; then
          echo "No changes in generated files; skipping commit."
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geosite-cheburnet.json geosite-cheburnet.srs
          git commit -m "[auto] Update geosite-cheburnet $(date '+%Y-%m-%d %H:%M:%S')"
          git push

          curl -sfL "https://purge.jsdelivr.net/gh/jinndi/geosite-cheburnet@main/geosite-cheburnet.srs"
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      if: steps.check_changes.outputs.changed == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.${{ github.run_number }}
        name: Релиз 1.${{ github.run_number }}
        files: |
          geosite-cheburnet.json
          geosite-cheburnet.srs
        body: |
          Автоматическая публикация файлов geosite-cheburnet
          Всего доменов: ${{ steps.count_domains.outputs.count }}
          - geosite-cheburnet.json: JSON формат
          - geosite-cheburnet.srs: Sing-box rule_set формат
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
